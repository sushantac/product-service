server:
  port: 8083
  shutdown: graceful
  tomcat:
    connection-timeout: 20s
    keep-alive-timeout: 20s

spring:
  application:
    name: product-service

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${POSTGRES_DB:ecommerce}?currentSchema=product
    username: ${DB_USERNAME:ecommerce}
    password: ${DB_PASSWORD:secret}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: product
        dialect: org.hibernate.dialect.PostgreSQLDialect

  liquibase:
    enabled: true
    change-log: classpath:db/product/changelog/db.changelog-master.xml
    default-schema: product

  spring:
    kafka:
    bootstrap.servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
      producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
    properties:
      spring.json.trusted.packages: com.ecommerce.product.event

  security:
    oauth2:
      resourceserver:
        jwt:
          secret: ${JWT_SECRET:dev-secret-change-me-please-at-least-32chars-long-123}

app:
  internal:
    api-key: ${INTERNAL_API_KEY:internal-service-key-12345}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
